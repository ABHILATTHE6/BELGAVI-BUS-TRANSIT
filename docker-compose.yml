version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://bus_admin:bus_secure_pass@postgres:5432/bus_transit?schema=public
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - redis
      - mqtt
    restart: always

  postgres:
    image: postgis/postgis:15-3.3
    container_name: bus_transit_postgres
    environment:
      POSTGRES_USER: bus_admin
      POSTGRES_PASSWORD: bus_secure_pass
      POSTGRES_DB: bus_transit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bus_transit_redis
    ports:
      - "6379:6379"

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: bus_transit_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  postgres_data:
